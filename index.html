    <script>
      (function() {
        // 1. Filter out console errors from Vite dev server HMR websocket
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return String((a && a.message) || a); }).join(' ');
          if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('vite:ws') !== -1 || (msg.indexOf('[vite]') !== -1 && msg.indexOf('websocket') !== -1)) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        // 2. Intercept window errors and unhandled promise rejections
        window.addEventListener('error', function(event) {
          if (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('vite') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason && (reason.message || String(reason));
          if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // 3. Graceful Vite HMR WebSocket Handler
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          var SafeWebSocket = function(url, protocols) {
            var isHmr = (protocols === 'vite-hmr') ||
                        (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                        (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1));

            if (isHmr) {
              var listeners = {};
              var mock = {
                readyState: 1, // OPEN
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                url: url,
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try {
                        if (mock.onopen) mock.onopen({ type: 'open' });
                        fn({ type: 'open' });
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {
                  mock.readyState = 3;
                }
              };
              return mock;
            }
            return new OrigWebSocket(url, protocols);
          };
          SafeWebSocket.prototype = OrigWebSocket.prototype;
          SafeWebSocket.CONNECTING = 0;
          SafeWebSocket.OPEN = 1;
          SafeWebSocket.CLOSING = 2;
          SafeWebSocket.CLOSED = 3;
          window.WebSocket = SafeWebSocket;
        }
      })();
    </script>
