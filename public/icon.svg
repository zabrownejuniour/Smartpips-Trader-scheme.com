<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0F19"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#2563EB"/>
      <stop offset="100%" stopColor="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#1E293B" stroke-width="6"/>
  <!-- Institutional Candlesticks -->
  <g transform="translate(64, 96)">
    <!-- Candle 1: Red -->
    <line x1="60" y1="90" x2="60" y2="240" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
    <rect x="44" y="120" width="32" height="90" rx="6" fill="#EF4444"/>

    <!-- Candle 2: Green -->
    <line x1="140" y1="60" x2="140" y2="220" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
    <rect x="124" y="80" width="32" height="110" rx="6" fill="#10B981"/>

    <!-- Candle 3: Big Green Breakout -->
    <line x1="220" y1="30" x2="220" y2="200" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
    <rect x="204" y="45" width="32" height="135" rx="6" fill="#10B981"/>

    <!-- Candle 4: Pullback consolidation -->
    <line x1="300" y1="50" x2="300" y2="180" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
    <rect x="284" y="70" width="32" height="70" rx="6" fill="#EF4444"/>

    <!-- Trend Vector Arrow -->
    <path d="M 40 230 Q 180 160 340 30" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round"/>
    <polygon points="340,15 355,45 325,40" fill="#10B981"/>
  </g>
  <!-- Smartpips Brand Monogram -->
  <text x="256" y="430" fill="#F8FAFC" font-size="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="3">SMARTPIPS</text>
  <text x="256" y="465" fill="#38BDF8" font-size="18" font-family="monospace" font-weight="700" text-anchor="middle" letter-spacing="4">TRADERSCHEME.COM</text>
</svg>
